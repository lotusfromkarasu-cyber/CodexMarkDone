<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex MarkDone</title><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="stylesheet" href="/vendor/katex/katex.min.css"><link rel="stylesheet" href="/styles.css"></head>
<body><header><div class="brand"><span class="logo">▤</span><b>MarkDone</b><small>CODEX READER</small></div><div class="header-actions"><button id="toggle-left" class="icon-btn" title="项目列表">☰ <span>项目</span></button><button id="toggle-right" class="icon-btn" title="当前会话">☷ <span>当前会话</span></button><select id="theme" aria-label="主题"><option value="system">◐ 跟随系统</option><option value="light">☀ 浅色</option><option value="dark">☾ 深色</option></select></div></header>
<div id="toolbar"><div class="toolbar-left"><button id="select-all" class="ghost">全选内容</button><button id="multi-toggle" class="ghost">多选</button><button id="focus-toggle" class="ghost">单条阅读</button><span id="selection-label" class="muted">未选择</span></div><div class="toolbar-right"><button id="copy-obsidian" data-copy="obsidian" disabled>复制 Obsidian</button><button id="copy-word" data-copy="word" class="primary" disabled>复制到 Word</button><button id="copy-wps" data-copy="wps" disabled>复制到 WPS</button><button id="copy-latex" data-copy="latex" disabled>复制纯 LaTeX</button><button id="copy-formula" data-copy="formula" disabled>复制公式</button></div></div>
<div class="workspace"><aside id="left"><div class="aside-head"><h2>项目与对话</h2><span class="head-right"><button id="sync-now" class="sync-btn" title="立即同步一次">⟳</button><button id="sync-auto" class="sync-btn" title="自动同步开关">⏸ 暂停同步</button><span id="sync" class="muted">连接中</span></span></div><input id="project-search" type="search" placeholder="搜索对话标题…" aria-label="搜索对话标题"><label class="archive-toggle"><input type="checkbox" id="archives"> 查看归档</label><nav id="library"></nav><footer>本机文件 · <span id="sync-mode">自动同步</span></footer></aside>
<div id="drag-left" class="drag-v" title="拖动调整左侧栏宽度"></div>
<main><div class="thread-head"><div><small id="project-label">你的本地知识空间</small><h1 id="thread-title">选择一个对话开始阅读</h1></div><span id="message-count" class="muted"></span></div><div id="reader"><div id="welcome"><span class="welcome-mark">✦</span><h2>让每一段思考，都好读、好用。</h2><p>从左侧选择对话，阅读、搜索，并将公式直接复制到 Word。</p></div><section id="messages"></section></div><button id="new-content" hidden>有新内容 ↓</button></main>
<div id="drag-right" class="drag-v" title="拖动调整右侧栏宽度"></div>
<aside id="right"><div class="aside-head"><h2>当前会话</h2><span id="nav-count" class="muted"></span></div><input id="content-search" type="search" placeholder="搜索正文或 LaTeX…" aria-label="搜索当前会话"><div class="search-controls"><span id="match-count">输入内容以搜索</span><button id="prev-match" aria-label="上一处">↑</button><button id="next-match" aria-label="下一处">↓</button></div>
<div class="right-split"><div class="aside-sub">对话节点</div><nav id="turn-nav"></nav><div id="drag-turn" class="drag-h" title="拖动调整节点/导航高度"></div><div class="aside-sub">消息导航</div><nav id="message-nav"></nav></div>
<footer>节点以提问为界 · 点击跳转 · “选回答”选中该轮全部回答</footer></aside></div>
<div id="copy-popover" role="toolbar" aria-label="选区复制" hidden><div class="popover-label"><span id="selection-label-pop"></span><button id="dismiss" aria-label="关闭浮窗">×</button></div><div class="copy-buttons"><button data-copy="obsidian">复制 Obsidian</button><button data-copy="word" class="primary">复制到 Word</button><button data-copy="wps">复制到 WPS</button><button data-copy="latex">复制纯 LaTeX</button><button data-copy="formula">复制公式</button></div></div>
<div id="focus-modal" hidden><div id="focus-window" role="dialog" aria-label="单条阅读"><div id="focus-head"><span id="focus-meta"></span><button id="focus-close" title="关闭">×</button></div><div id="focus-body"></div><div id="focus-foot"><button id="focus-prev">❮ 上一条</button><span id="focus-count"></span><button id="focus-next">下一条 ❯</button></div></div></div>
<div id="toast" role="status"></div>
<script src="/vendor/markdown-it.min.js"></script><script src="/vendor/katex/katex.min.js"></script><script src="/vendor/turndown.js"></script><script src="/vendor/turndown-plugin-gfm.js"></script><script src="/render.js"></script><script src="/app.js"></script></body></html>
